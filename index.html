  <style>
    :root {
      --primary: #c0392b;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }
    .subtitle {
      color: #7f8c8d;
      font-size: 0.95rem;
    }
    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .btn-filter {
      background: #e2e8f0;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-filter.active, .btn-filter:hover {
      background: var(--primary);
      color: white;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 5px solid var(--primary);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .tag {
      display: inline-block;
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      width: fit-content;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 1.15rem;
    }
    .info {
      font-size: 0.88rem;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 0.9rem;
      color: #6b7280;
      margin: 12px 0;
      line-height: 1.4;
    }
    .link-btn {
      display: inline-block;
      text-align: center;
      background: #f3f4f6;
      color: #1f2937;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 10px;
    }
    .link-btn:hover {
      background: #e5e7eb;
    }
  </style>
</head>

  <script>
    let todosEventos = [];

    try {
      const jsonText = document.getElementById('datos-eventos').textContent;
      todosEventos = JSON.parse(jsonText);
    } catch (e) {
      console.error('Error al parsear eventos:', e);
    }

    function renderizar(eventos) {
      const contenedor = document.getElementById('contenedor-eventos');
      contenedor.innerHTML = '';

      if (!eventos || eventos.length === 0) {
        contenedor.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No hay eventos disponibles para esta selección.</p>';
        return;
      }

      eventos.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'card';
        
        const cardClass = ev.categoria && ev.categoria.includes('Cultura') ? 'card cultura' : 'card';
        card.className = cardClass;
        
        const cat = ev.categoria || 'Cultura';
        const tit = ev.titulo || 'Sin título';
        const fec = ev.fecha || 'Consultar fecha';
        const lug = ev.lugar || 'Terrassa';
        const des = ev.descripcion || '';
        const url = (ev.fuente_url && ev.fuente_url.length > 5) ? ev.fuente_url : '#';
        const fue = ev.fuente_nombre || 'Fuente original';

        card.innerHTML = `
          <div>
            <span class="tag">${cat}</span>
            <h3>${tit}</h3>
            <div class="info">📅 ${fec}</div>
            <div class="info">📍 ${lug}</div>
            <p class="desc">${des}</p>
          </div>
          <a href="${url}" target="_blank" class="link-btn">Ver en ${fue} ↗</a>
        `;
        contenedor.appendChild(card);
      });
    }

    function filtrar(cat) {
      document.querySelectorAll('.btn-filter').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.trim() === cat);
      });

      if (cat === 'Todos') {
        renderizar(todosEventos);
      } else {
        const clave = cat.split('/')[0].toLowerCase();
        const filtrados = todosEventos.filter(e => e.categoria && e.categoria.toLowerCase().includes(clave));
        renderizar(filtrados);
      }
    }

    document.addEventListener('DOMContentLoaded', () => renderizar(todosEventos));
  </script>
</body>
</html>
